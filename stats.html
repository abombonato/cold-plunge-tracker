<!DOCTYPE html>
<html>
<head>
  <title>Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>📊 Stats</h1>

  <div class="stats-grid">

    <div class="stat-card gold">
      <h2 id="totalSessions">0</h2>
      <p>Total Sessions</p>
    </div>

    <div class="stat-card bluegreen">
      <h2 id="totalTime">0</h2>
      <p>Total Time</p>
    </div>

    <div class="stat-card pink">
      <h2 id="avgDuration">0</h2>
      <p>Avg Duration</p>
    </div>

    <div class="stat-card babyblue">
      <h2 id="avgTemp">0</h2>
      <p>Avg Water Temp</p>
    </div>

    <div class="stat-card gold">
      <h2 id="coldestPlunge">0</h2>
      <p>Coldest Plunge</p>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
