<!DOCTYPE html>
<html>
<head>
  <title>Stats</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <a href="index.html"><button class="btn freesia">← Back</button></a>

  <h1>📊 Stats</h1>

  <div class="stats-grid">

    <div class="stat-card">
      <h2 id="totalSessions">0</h2>
      <p>Total Sessions</p>
    </div>

    <div class="stat-card">
      <h2 id="totalTime">0</h2>
      <p>Total Time</p>
    </div>

    <div class="stat-card">
      <h2 id="avgDuration">0</h2>
      <p>Avg Duration</p>
    </div>

    <div class="stat-card">
      <h2 id="avgTemp">0</h2>
      <p>Avg Water Temp</p>
    </div>

    <div class="stat-card">
      <h2 id="coldest">0</h2>
      <p>Coldest Plunge</p>
    </div>

  </div>

</div>

<script>
const data = JSON.parse(localStorage.getItem("plunges")) || [];

const totalSessions = data.length;
const totalTime = data.reduce((s,p)=>s+Number(p.duration||0),0);
const avgDuration = totalSessions ? (totalTime/totalSessions).toFixed(1) : 0;
const avgTemp = totalSessions ? (data.reduce((s,p)=>s+Number(p.waterTemp||0),0)/totalSessions).toFixed(1) : 0;
const coldest = totalSessions ? Math.min(...data.map(p=>Number(p.waterTemp||0))) : 0;

document.getElementById("totalSessions").innerText = totalSessions;
document.getElementById("totalTime").innerText = totalTime + " min";
document.getElementById("avgDuration").innerText = avgDuration + " min";
document.getElementById("avgTemp").innerText = avgTemp + "°C";
document.getElementById("coldest").innerText = coldest + "°C";
</script>

</body>
</html>
