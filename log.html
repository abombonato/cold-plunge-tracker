<!DOCTYPE html>
<html>
<head>
  <title>Log Session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="top-bar">
    <a href="index.html"><button class="btn mint">← Back</button></a>
  </div>

  <h1>🧊 Log Session</h1>

  <div class="card">
    <form id="plungeForm">

      <div class="field">
        <label>Date</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>Duration (min)</label>
        <input type="number" id="duration">
      </div>

      <div class="field">
        <label>Location</label>
        <input type="text" id="location">
      </div>

      <div class="field">
        <label>Water Temp</label>
        <input type="number" id="waterTemp">
      </div>

      <div class="field">
        <label>Outside Temp</label>
        <input type="number" id="outsideTemp">
      </div>

      <div class="field">
        <label>Cycle Phase</label>
        <input type="text" id="cyclePhase">
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <!-- BEFORE -->
      <div class="field">
        <label>Before</label>
        <div class="grid">
          <button type="button" class="mood" data-type="before" data-value="Anxious">😰</button>
          <button type="button" class="mood" data-type="before" data-value="Tired">😴</button>
          <button type="button" class="mood" data-type="before" data-value="Energized">⚡</button>
          <button type="button" class="mood" data-type="before" data-value="Neutral">😐</button>
          <button type="button" class="mood" data-type="before" data-value="Sad">😢</button>
          <button type="button" class="mood" data-type="before" data-value="Happy">😊</button>
        </div>
      </div>

      <!-- AFTER -->
      <div class="field">
        <label>After</label>
        <div class="grid">
          <button type="button" class="mood" data-type="after" data-value="Calm">😌</button>
          <button type="button" class="mood" data-type="after" data-value="Alert">👀</button>
          <button type="button" class="mood" data-type="after" data-value="Euphoric">🤩</button>
          <button type="button" class="mood" data-type="after" data-value="Still Cold">🥶</button>
        </div>
      </div>

      <!-- DIFFICULTY -->
      <div class="field">
        <label>Difficulty</label>
        <div class="grid">
          <button type="button" class="diff" data-value="Easy">Easy</button>
          <button type="button" class="diff" data-value="Medium">Medium</button>
          <button type="button" class="diff" data-value="Hard">Hard</button>
        </div>
      </div>

      <button class="btn pink full" type="submit">Save Session</button>

    </form>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
