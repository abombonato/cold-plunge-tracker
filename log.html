<!DOCTYPE html>
        <input type="text" id="location">
      </div>

      <div class="field">
        <label>Water Temperature (°C)</label>
        <input type="number" id="waterTemp">
      </div>

      <div class="field">
        <label>Outside Temperature (°C)</label>
        <input type="number" id="outsideTemp">
      </div>

      <div class="field">
        <label>Cycle Phase</label>
        <input type="text" id="cyclePhase">
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="field">
        <label>How I Feel Before</label>
        <div class="mood-grid">
          <button type="button" class="mood-btn" data-value="Anxious">😰 Anxious</button>
          <button type="button" class="mood-btn" data-value="Tired">😴 Tired</button>
          <button type="button" class="mood-btn" data-value="Energized">⚡ Energized</button>
          <button type="button" class="mood-btn" data-value="Neutral">😐 Neutral</button>
          <button type="button" class="mood-btn" data-value="Sad">😢 Sad</button>
          <button type="button" class="mood-btn" data-value="Happy">😊 Happy</button>
        </div>
      </div>

      <div class="field">
        <label>How I Feel After</label>
        <div class="mood-grid">
          <button type="button" class="mood-btn" data-value="Calm">😌 Calm</button>
          <button type="button" class="mood-btn" data-value="Alert">👀 Alert</button>
          <button type="button" class="mood-btn" data-value="Euphoric">🤩 Euphoric</button>
          <button type="button" class="mood-btn" data-value="Still Cold">🥶 Still Cold</button>
        </div>
      </div>

      <div class="field">
        <label>Perceived Difficulty</label>
        <div class="difficulty-grid">
          <button type="button" class="diff-btn" data-value="Easy">Easy</button>
          <button type="button" class="diff-btn" data-value="Medium">Medium</button>
          <button type="button" class="diff-btn" data-value="Hard">Hard</button>
        </div>
      </div>

      <button type="submit" class="btn gold full">Save Session</button>

    </form>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
