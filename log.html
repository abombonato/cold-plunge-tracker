<!DOCTYPE html>
<html>
<head>
  <title>Log Session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <a href="index.html"><button class="btn mint">← Back</button></a>

  <h1>🧊 Log Session</h1>

  <div class="card">
    <form id="plungeForm">

      <div class="field">
        <label>date</label>
        <input type="date" id="date">
      </div>

      <div class="field">
        <label>duration (min)</label>
        <input type="number" id="duration">
      </div>

      <div class="field">
        <label>location</label>
        <input type="text" id="location">
      </div>

      <div class="field">
        <label>water temperature</label>
        <input type="number" id="waterTemp">
      </div>

      <div class="field">
        <label>outside temperature</label>
        <input type="number" id="outsideTemp">
      </div>

      <div class="field">
        <label>cycle phase</label>
        <input type="text" id="cyclePhase">
      </div>

      <div class="field">
        <label>notes</label>
        <textarea id="notes"></textarea>
      </div>

      <!-- BEFORE -->
      <div class="field">
        <label>before</label>
        <div class="grid">
          <button type="button" class="mood" data-type="before" data-value="Anxious">😰 Anxious</button>
          <button type="button" class="mood" data-type="before" data-value="Tired">😴 Tired</button>
          <button type="button" class="mood" data-type="before" data-value="Energized">⚡ Energized</button>
          <button type="button" class="mood" data-type="before" data-value="Neutral">😐 Neutral</button>
          <button type="button" class="mood" data-type="before" data-value="Sad">😢 Sad</button>
          <button type="button" class="mood" data-type="before" data-value="Happy">😊 Happy</button>
        </div>
      </div>

      <!-- AFTER -->
      <div class="field">
        <label>after</label>
        <div class="grid">
          <button type="button" class="mood" data-type="after" data-value="Calm">😌 Calm</button>
          <button type="button" class="mood" data-type="after" data-value="Alert">👀 Alert</button>
          <button type="button" class="mood" data-type="after" data-value="Euphoric">🤩 Euphoric</button>
          <button type="button" class="mood" data-type="after" data-value="Still Cold">🥶 Still Cold</button>
        </div>
      </div>

      <!-- DIFFICULTY -->
      <div class="field">
        <label>perceived difficulty</label>
        <div class="grid">
          <button type="button" class="diff" data-value="Easy">Easy</button>
          <button type="button" class="diff" data-value="Medium">Medium</button>
          <button type="button" class="diff" data-value="Hard">Hard</button>
        </div>
      </div>

      <button class="btn pink full" type="submit">Save Session</button>

    </form>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
